<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中秋预约后台</title>
<style>*{box-sizing:border-box}body{font-family:Arial,"Microsoft YaHei",sans-serif;padding:20px;background:#f5eee2;color:#33251f}h1{color:#8d241c}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar button{padding:10px 16px;background:#8d241c;color:white;border:0;border-radius:7px;cursor:pointer}.s{display:inline-block;background:white;padding:15px;margin:6px;border-radius:10px;min-width:150px}.n{font-size:24px;font-weight:bold;color:#8d241c}.table-wrap{overflow:auto;background:white;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}th{background:#fff8ed;position:sticky;top:0}.muted{color:#76685f;font-size:13px}.error{color:#a00}</style></head>
<body><h1>🌕 中秋活动预约后台</h1><div class="toolbar"><button onclick="load()">刷新｜Actualizar</button><span id="status" class="muted"></span></div><div id="s"></div><div class="table-wrap"><table><thead><tr><th>姓名</th><th>游戏</th><th>时间</th><th>编号</th></tr></thead><tbody id="t"></tbody></table></div>
<script src="config.js"></script><script type="module">
import {getState} from "./github-api.js";
const s=document.getElementById("s"),t=document.getElementById("t"),statusEl=document.getElementById("status");
function td(text){const e=document.createElement("td");e.textContent=text??"";return e}
async function load(){statusEl.textContent="读取中…";statusEl.className="muted";try{const d=await getState(),acts=d.activities||[],counts=d.counts||{},rows=d.reservations||[];s.replaceChildren(...acts.map(a=>{const box=document.createElement("div");box.className="s";box.append(document.createTextNode(a.nameZh));const n=document.createElement("div");n.className="n";n.textContent=`${counts[a.id]||0} / ${a.capacity} 人`;box.append(n);return box}));t.replaceChildren();[...rows].reverse().forEach(x=>{const tr=document.createElement("tr");tr.append(td(x.name),td(x.activity),td(new Date(x.time).toLocaleString()),td(x.id));t.append(tr)});statusEl.textContent=`共 ${rows.length} 条预约 · ${new Date().toLocaleString()}`}catch(e){statusEl.textContent=e.message;statusEl.className="error"}}
window.load=load;load();</script></body></html>
