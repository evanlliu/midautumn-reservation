<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中秋预约后台</title>
<style>
*{box-sizing:border-box}
:root{--red:#8d241c;--red2:#b42318;--bg:#f5eee2;--paper:#fff;--cream:#fff8ed;--line:#ead7b3;--text:#33251f;--muted:#76685f}
body{font-family:Arial,"Microsoft YaHei",sans-serif;padding:20px;background:var(--bg);color:var(--text);margin:0}
h1{color:var(--red);margin:0 0 18px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:600;font:inherit}
.primary{background:var(--red);color:white}.secondary{background:#e9dfd0;color:#4e3b31}.danger{background:var(--red2);color:white;padding:7px 12px}
button:disabled{opacity:.55;cursor:not-allowed}
#s{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.s{background:white;padding:15px;border-radius:10px;min-width:150px;box-shadow:0 1px 2px rgba(0,0,0,.03);cursor:pointer;border:2px solid transparent;transition:.15s ease;user-select:none}
.s:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08);border-color:#d9b98b}.s:focus{outline:3px solid rgba(141,36,28,.18);outline-offset:2px}.s.active{border-color:var(--red);background:#fff4e7;box-shadow:0 3px 10px rgba(141,36,28,.12)}
.n{font-size:24px;font-weight:bold;color:var(--red);margin-top:4px}
.filter-toggle{display:none;width:100%;background:var(--cream);color:#4e3b31;border:1px solid var(--line);justify-content:space-between;align-items:center;text-align:left;margin-bottom:8px}
.filter-toggle .chevron{transition:transform .18s ease}.filter-toggle.open .chevron{transform:rotate(180deg)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px}
.filters label{display:flex;align-items:center;gap:6px;font-size:14px}.filters input,.filters select{height:38px;border:1px solid #cfbea4;border-radius:7px;padding:0 10px;background:white;min-width:150px;color:var(--text);font:inherit}.filters input[type="date"]{min-width:145px}
.filter-actions{display:flex;gap:8px;align-items:center}.close-filter{display:none}
.result{font-weight:600;color:#6b4b3a}.muted{color:var(--muted);font-size:13px}.error{color:#a00}.id{font-family:Consolas,monospace;letter-spacing:.4px}
.table-wrap{overflow:auto;background:white;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:820px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:middle}th{background:var(--cream);position:sticky;top:0;z-index:1}.empty{text-align:center;color:#8a7a70;padding:30px}
.mobile-list{display:none}.mobile-empty{padding:26px 14px;text-align:center;color:#8a7a70;background:#fff;border-radius:12px}
.mobile-resultbar{display:none}

@media(max-width:700px){
  body{padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
  h1{font-size:26px;line-height:1.15;margin:4px 2px 12px;white-space:normal;overflow-wrap:anywhere}
  .toolbar{margin:0 2px 10px;gap:8px;flex-wrap:nowrap}
  .toolbar .primary{padding:9px 13px;white-space:nowrap}
  #status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  #s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:9px}
  .s{min-width:0;margin:0;padding:10px 12px;border-width:1.5px;border-radius:10px}
  .s:hover{transform:none}.s .n,.n{font-size:21px;margin-top:3px}
  .filter-toggle{display:flex;padding:10px 12px;margin-bottom:8px}
  .filter-toggle strong{color:var(--red)}
  .filters{display:none;margin-bottom:8px;padding:10px;border-radius:10px;gap:8px}
  .filters.open{display:grid;grid-template-columns:1fr 1fr;align-items:end}
  .filters label{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:12px;color:#675247}
  .filters input,.filters select,.filters input[type="date"]{width:100%;min-width:0;height:40px;font-size:15px}
  .filter-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filter-actions button{width:100%;padding:9px 8px}
  .close-filter{display:block;background:var(--red);color:#fff}
  .filters #resultStatus{display:none}
  .mobile-resultbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 3px 8px;font-size:13px;color:var(--muted)}
  .mobile-resultbar .result{font-size:13px}
  .table-wrap{display:none}
  .mobile-list{display:flex;flex-direction:column;gap:7px}
  .reservation-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:10px 10px 10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.025)}
  .reservation-main{min-width:0}
  .reservation-top{display:flex;gap:7px;align-items:center;min-width:0;margin-bottom:4px}
  .reservation-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity-badge{font-size:12px;color:var(--red);background:#fff2e7;padding:3px 7px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
  .reservation-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);line-height:1.25}
  .reservation-meta .id{font-size:11.5px;color:#5d4d45}
  .reservation-card .danger{padding:8px 10px;min-width:52px;font-size:13px}
}

@media(max-width:380px){
  h1{font-size:22px}.filters.open{grid-template-columns:1fr}.filter-actions{grid-column:1}.activity-badge{max-width:54%}
}
</style>
</head>
<body>
<h1 id="pageTitle">🌕</h1>
<div class="toolbar">
  <button id="refreshBtn" class="primary"></button>
  <span id="status" class="muted"></span>
</div>
<div id="s"></div>

<button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false">
  <span>🔎 <strong id="filterToggleText"></strong> <span id="filterSummary" class="muted"></span></span>
  <span class="chevron">⌄</span>
</button>

<div id="filters" class="filters">
  <label><span id="nameLabel"></span> <input id="qName" type="search"></label>
  <label><span id="idLabel"></span> <input id="qId" type="search"></label>
  <label><span id="activityLabel"></span> <select id="qActivity"></select></label>
  <label><span id="dateLabel"></span> <input id="qDate" type="date"></label>
  <div class="filter-actions">
    <button id="resetBtn" class="secondary" type="button"></button>
    <button id="closeFilterBtn" class="close-filter" type="button"></button>
  </div>
  <span id="resultStatus" class="result"></span>
</div>

<div class="mobile-resultbar">
  <span id="mobileResultStatus" class="result"></span>
  <span id="mobileHint"></span>
</div>

<div class="table-wrap">
<table>
<thead><tr><th id="thName"></th><th id="thActivity"></th><th id="thTime"></th><th id="thId"></th><th id="thActions"></th></tr></thead>
<tbody id="t"></tbody>
</table>
</div>
<div id="mobileList" class="mobile-list"></div>

<script src="config.js"></script>
<script type="module">
import {getState, deleteReservation} from "./github-api.js";

const LANG = (()=>{
  const langs = Array.isArray(navigator.languages) && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  const first = String(langs[0] || "en").toLowerCase();
  if(first.startsWith("zh")) return "zh";
  if(first.startsWith("es")) return "es-MX";
  return "en";
})();

const I18N={
  zh:{
    htmlLang:"zh-CN", locale:"zh-CN", title:"中秋活动预约后台", refresh:"刷新", filterToggle:"查询筛选",
    allReservations:"全部预约", name:"姓名", namePlaceholder:"输入姓名", id:"编号", idPlaceholder:"如 6BC70C27",
    activity:"游戏", allActivities:"全部游戏", date:"日期", reset:"重置查询", close:"完成并收起",
    result:(shown,total)=>`查询结果 ${shown} / ${total} 条`, mobileResult:(shown,total)=>`${shown} / ${total} 条`,
    mobileHint:"点上方活动卡片可直接筛选", time:"时间", actions:"操作", delete:"删除", deleting:"删除中…",
    empty:"没有符合条件的预约记录", people:"人", reservations:"条预约", loading:"读取中…",
    totalStatus:(count,time)=>`共 ${count} 条预约 · ${time}`,
    filters:(count,rows)=>`${count} 个条件 · ${rows} 条`, allSummary:rows=>`全部预约 · ${rows} 条`,
    cardTitle:name=>`点击查询 ${name} 的预约`, deleteAria:name=>`删除 ${name} 的预约`,
    confirm:(row,activity)=>`确认删除这条预约？\n\n姓名：${row.name}\n游戏：${activity}\n编号：${row.id}\n\n删除后该用户可以重新预约。`,
    deletingStatus:name=>`正在删除 ${name}…`, deleted:(name,id,time)=>`已删除 ${name}（${id}） · ${time}`, deleteFailed:msg=>`删除失败：${msg}`,
    activities:{bracelet:"DIY手工手串",rings:"欢乐套圈",fan:"漆扇制作",sachet:"制作香囊"}
  },
  en:{
    htmlLang:"en", locale:"en-US", title:"Mid-Autumn Festival Reservation Admin", refresh:"Refresh", filterToggle:"Search filters",
    allReservations:"All reservations", name:"Name", namePlaceholder:"Enter name", id:"Reservation ID", idPlaceholder:"e.g. 6BC70C27",
    activity:"Activity", allActivities:"All activities", date:"Date", reset:"Reset filters", close:"Done & collapse",
    result:(shown,total)=>`Results ${shown} / ${total}`, mobileResult:(shown,total)=>`${shown} / ${total}`,
    mobileHint:"Tap an activity card above to filter", time:"Time", actions:"Actions", delete:"Delete", deleting:"Deleting…",
    empty:"No reservations match the current filters", people:"people", reservations:"reservations", loading:"Loading…",
    totalStatus:(count,time)=>`${count} reservations · ${time}`,
    filters:(count,rows)=>`${count} filters · ${rows} results`, allSummary:rows=>`All reservations · ${rows}`,
    cardTitle:name=>`Show reservations for ${name}`, deleteAria:name=>`Delete ${name}'s reservation`,
    confirm:(row,activity)=>`Delete this reservation?\n\nName: ${row.name}\nActivity: ${activity}\nReservation ID: ${row.id}\n\nAfter deletion, this person can reserve again.`,
    deletingStatus:name=>`Deleting ${name}…`, deleted:(name,id,time)=>`Deleted ${name} (${id}) · ${time}`, deleteFailed:msg=>`Delete failed: ${msg}`,
    activities:{bracelet:"DIY Bracelet",rings:"Ring Toss",fan:"Lacquer Fan Making",sachet:"Sachet Making"}
  },
  "es-MX":{
    htmlLang:"es-MX", locale:"es-MX", title:"Administración de reservas del Festival de Medio Otoño", refresh:"Actualizar", filterToggle:"Filtros de búsqueda",
    allReservations:"Todas las reservas", name:"Nombre", namePlaceholder:"Escribe un nombre", id:"Código", idPlaceholder:"Ej. 6BC70C27",
    activity:"Actividad", allActivities:"Todas las actividades", date:"Fecha", reset:"Restablecer", close:"Listo y cerrar",
    result:(shown,total)=>`Resultados ${shown} / ${total}`, mobileResult:(shown,total)=>`${shown} / ${total}`,
    mobileHint:"Toca una actividad arriba para filtrar", time:"Hora", actions:"Acciones", delete:"Eliminar", deleting:"Eliminando…",
    empty:"No hay reservas que coincidan con los filtros", people:"personas", reservations:"reservas", loading:"Cargando…",
    totalStatus:(count,time)=>`${count} reservas · ${time}`,
    filters:(count,rows)=>`${count} filtros · ${rows} resultados`, allSummary:rows=>`Todas las reservas · ${rows}`,
    cardTitle:name=>`Ver reservas de ${name}`, deleteAria:name=>`Eliminar la reserva de ${name}`,
    confirm:(row,activity)=>`¿Eliminar esta reserva?\n\nNombre: ${row.name}\nActividad: ${activity}\nCódigo: ${row.id}\n\nDespués de eliminarla, esta persona podrá reservar de nuevo.`,
    deletingStatus:name=>`Eliminando la reserva de ${name}…`, deleted:(name,id,time)=>`Reserva eliminada: ${name} (${id}) · ${time}`, deleteFailed:msg=>`Error al eliminar: ${msg}`,
    activities:{bracelet:"Pulsera artesanal",rings:"Juego de aros",fan:"Elaboración de abanico lacado",sachet:"Saquito aromático"}
  }
};
const tr=I18N[LANG];

document.documentElement.lang=tr.htmlLang;
document.title=tr.title;

const s=document.getElementById("s");
const t=document.getElementById("t");
const mobileList=document.getElementById("mobileList");
const statusEl=document.getElementById("status");
const resultStatus=document.getElementById("resultStatus");
const mobileResultStatus=document.getElementById("mobileResultStatus");
const refreshBtn=document.getElementById("refreshBtn");
const resetBtn=document.getElementById("resetBtn");
const qName=document.getElementById("qName");
const qId=document.getElementById("qId");
const qActivity=document.getElementById("qActivity");
const qDate=document.getElementById("qDate");
const filters=document.getElementById("filters");
const filterToggle=document.getElementById("filterToggle");
const filterSummary=document.getElementById("filterSummary");
const closeFilterBtn=document.getElementById("closeFilterBtn");

let state={activities:[],reservations:[],counts:{}};
let deletingId="";

function applyStaticText(){
  document.getElementById("pageTitle").textContent=`🌕 ${tr.title}`;
  refreshBtn.textContent=tr.refresh;
  document.getElementById("filterToggleText").textContent=tr.filterToggle;
  filterSummary.textContent=tr.allReservations;
  document.getElementById("nameLabel").textContent=tr.name;
  document.getElementById("idLabel").textContent=tr.id;
  document.getElementById("activityLabel").textContent=tr.activity;
  document.getElementById("dateLabel").textContent=tr.date;
  qName.placeholder=tr.namePlaceholder;
  qId.placeholder=tr.idPlaceholder;
  resetBtn.textContent=tr.reset;
  closeFilterBtn.textContent=tr.close;
  document.getElementById("mobileHint").textContent=tr.mobileHint;
  document.getElementById("thName").textContent=tr.name;
  document.getElementById("thActivity").textContent=tr.activity;
  document.getElementById("thTime").textContent=tr.time;
  document.getElementById("thId").textContent=tr.id;
  document.getElementById("thActions").textContent=tr.actions;
}
applyStaticText();

function td(text,className=""){
  const e=document.createElement("td");e.textContent=text??"";if(className)e.className=className;return e;
}
function localDateKey(value){
  const d=new Date(value);if(Number.isNaN(d.getTime())) return "";
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function formatDateTime(value){
  const d=new Date(value);if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString(tr.locale,{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
}
function compactDate(value){
  const d=new Date(value);if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString(tr.locale,{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
}
function activityName(activityId,fallback=""){
  if(tr.activities[activityId]) return tr.activities[activityId];
  const a=state.activities.find(x=>x.id===activityId);
  if(LANG==="zh") return a?.nameZh||fallback||activityId;
  if(LANG==="es-MX") return a?.nameEs||fallback||a?.nameZh||activityId;
  return fallback||a?.nameZh||activityId;
}
function fillActivityFilter(activities){
  const current=qActivity.value;qActivity.replaceChildren(new Option(tr.allActivities,""));
  for(const a of activities) qActivity.add(new Option(activityName(a.id,a.nameZh),a.id));
  if([...qActivity.options].some(o=>o.value===current)) qActivity.value=current;
}
function renderStats(){
  s.replaceChildren(...state.activities.map(a=>{
    const label=activityName(a.id,a.nameZh);
    const box=document.createElement("div");box.className="s";box.dataset.activityId=a.id;box.setAttribute("role","button");box.setAttribute("tabindex","0");box.setAttribute("title",tr.cardTitle(label));
    box.append(document.createTextNode(label));
    const n=document.createElement("div");n.className="n";n.textContent=`${state.counts[a.id]||0} / ${a.capacity} ${tr.people}`;box.append(n);
    const selectActivity=()=>{qActivity.value=a.id;renderRows();collapseFiltersOnMobile();};
    box.addEventListener("click",selectActivity);box.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectActivity();}});
    return box;
  }));
  updateStatSelection();
}
function updateStatSelection(){
  s.querySelectorAll(".s").forEach(box=>{const active=box.dataset.activityId===qActivity.value;box.classList.toggle("active",active);box.setAttribute("aria-pressed",active?"true":"false");});
}
function filteredRows(){
  const name=qName.value.trim().toLowerCase(),id=qId.value.trim().toUpperCase(),activityId=qActivity.value,date=qDate.value;
  return [...state.reservations]
    .filter(x=>!name||String(x.name||"").toLowerCase().includes(name))
    .filter(x=>!id||String(x.id||"").toUpperCase().includes(id))
    .filter(x=>!activityId||x.activityId===activityId)
    .filter(x=>!date||localDateKey(x.time)===date)
    .reverse();
}
function activeFilterCount(){return [qName.value.trim(),qId.value.trim(),qActivity.value,qDate.value].filter(Boolean).length;}
function updateFilterSummary(rows){
  const count=activeFilterCount();
  filterSummary.textContent=count?tr.filters(count,rows.length):tr.allSummary(rows.length);
  filterToggle.classList.toggle("open",filters.classList.contains("open"));
  filterToggle.setAttribute("aria-expanded",filters.classList.contains("open")?"true":"false");
}
function makeDeleteButton(row,compact=false){
  const btn=document.createElement("button");btn.className="danger";btn.textContent=deletingId===row.id?tr.deleting:tr.delete;btn.disabled=Boolean(deletingId);if(compact)btn.setAttribute("aria-label",tr.deleteAria(row.name));btn.addEventListener("click",()=>removeRow(row));return btn;
}
function renderDesktopRows(rows){
  t.replaceChildren();
  if(!rows.length){const rowEl=document.createElement("tr"),cell=document.createElement("td");cell.colSpan=5;cell.className="empty";cell.textContent=tr.empty;rowEl.append(cell);t.append(rowEl);return;}
  for(const x of rows){
    const rowEl=document.createElement("tr");rowEl.append(td(x.name),td(activityName(x.activityId,x.activity)),td(formatDateTime(x.time)),td(x.id,"id"));
    const action=document.createElement("td");action.append(makeDeleteButton(x));rowEl.append(action);t.append(rowEl);
  }
}
function renderMobileRows(rows){
  mobileList.replaceChildren();
  if(!rows.length){const empty=document.createElement("div");empty.className="mobile-empty";empty.textContent=tr.empty;mobileList.append(empty);return;}
  for(const x of rows){
    const card=document.createElement("div");card.className="reservation-card";
    const main=document.createElement("div");main.className="reservation-main";
    const top=document.createElement("div");top.className="reservation-top";
    const name=document.createElement("div");name.className="reservation-name";name.textContent=x.name;
    const activity=document.createElement("span");activity.className="activity-badge";activity.textContent=activityName(x.activityId,x.activity);
    top.append(name,activity);
    const meta=document.createElement("div");meta.className="reservation-meta";
    const time=document.createElement("span");time.textContent=compactDate(x.time);
    const id=document.createElement("span");id.className="id";id.textContent=`#${x.id}`;
    meta.append(time,id);main.append(top,meta);card.append(main,makeDeleteButton(x,true));mobileList.append(card);
  }
}
function renderRows(){
  const rows=filteredRows();
  resultStatus.textContent=tr.result(rows.length,state.reservations.length);
  mobileResultStatus.textContent=tr.mobileResult(rows.length,state.reservations.length);
  updateStatSelection();updateFilterSummary(rows);renderDesktopRows(rows);renderMobileRows(rows);
}
async function load(){
  refreshBtn.disabled=true;statusEl.textContent=tr.loading;statusEl.className="muted";
  try{state=await getState();fillActivityFilter(state.activities);renderStats();renderRows();statusEl.textContent=tr.totalStatus(state.reservations.length,formatDateTime(new Date()));}
  catch(e){statusEl.textContent=e.message;statusEl.className="error";}
  finally{refreshBtn.disabled=false;}
}
async function removeRow(row){
  const label=activityName(row.activityId,row.activity);
  const ok=confirm(tr.confirm(row,label));if(!ok)return;
  deletingId=row.id;renderRows();statusEl.textContent=tr.deletingStatus(row.name);statusEl.className="muted";
  try{await deleteReservation(row.id);await load();statusEl.textContent=tr.deleted(row.name,row.id,formatDateTime(new Date()));}
  catch(e){statusEl.textContent=tr.deleteFailed(e.message);statusEl.className="error";}
  finally{deletingId="";renderRows();}
}
function collapseFiltersOnMobile(){if(window.matchMedia("(max-width:700px)").matches){filters.classList.remove("open");filterToggle.classList.remove("open");filterToggle.setAttribute("aria-expanded","false");}}
function toggleFilters(){const open=filters.classList.toggle("open");filterToggle.classList.toggle("open",open);filterToggle.setAttribute("aria-expanded",open?"true":"false");if(open)setTimeout(()=>qName.focus({preventScroll:true}),50);}
for(const el of [qName,qId,qActivity,qDate]) el.addEventListener(el.tagName==="INPUT"?"input":"change",renderRows);
resetBtn.addEventListener("click",()=>{qName.value="";qId.value="";qActivity.value="";qDate.value="";renderRows();collapseFiltersOnMobile();});
filterToggle.addEventListener("click",toggleFilters);closeFilterBtn.addEventListener("click",collapseFiltersOnMobile);refreshBtn.addEventListener("click",load);
load();
</script>
</body>
</html>
